pid /tmp/nginx.pid;

events {
  worker_connections 32;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 2m;

  server {
    listen 8080;

    location = /healthz {
      return 204;
    }

    location = /rest/v1/rpc/finance_claim_next_document {
      limit_except POST { deny all; }
      proxy_pass http://supabase_rest_kawana-07c11-staging:3000;
      proxy_set_header Host supabase_rest_kawana-07c11-staging;
      proxy_pass_request_headers on;
    }

    location = /rest/v1/rpc/finance_complete_document_v2 {
      limit_except POST { deny all; }
      proxy_pass http://supabase_rest_kawana-07c11-staging:3000;
      proxy_set_header Host supabase_rest_kawana-07c11-staging;
      proxy_pass_request_headers on;
    }

    location / {
      return 404;
    }
  }
}
