name: Deploy document content worker
on:
  workflow_dispatch:
    inputs:
      queues_paused:
        description: 'Confirme: filas 13C pausadas e execucoes encerradas'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fabio-document-content-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.queues_paused
    environment: fabio-vps
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate deployment scripts
        run: |
          bash -n workers/document-content/deploy-vps.sh
          python3 tests/document-content/test_deploy.py
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.FABIO_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.FABIO_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/fabio_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/fabio_deploy" >/dev/null
          ssh-keygen -F 187.127.38.70 >/dev/null
      - name: Transfer and deploy exact workflow commit
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_opts=(-i "$HOME/.ssh/fabio_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20)
          remote="/opt/fabio-document-content/incoming/actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git archive --format=tar "$GITHUB_SHA" workers/document-content > "$RUNNER_TEMP/worker.tar"
          digest=$(sha256sum "$RUNNER_TEMP/worker.tar" | cut -d' ' -f1)
          ssh "${ssh_opts[@]}" root@187.127.38.70 "umask 077; mkdir -p '$remote'; cat > '$remote/worker.tar'" < "$RUNNER_TEMP/worker.tar"
          ssh "${ssh_opts[@]}" root@187.127.38.70 "set -eu; cd '$remote'; echo '$digest  worker.tar' | sha256sum -c -; tar -xf worker.tar; timeout --signal=TERM --kill-after=180 25m bash workers/document-content/deploy-vps.sh '$GITHUB_SHA' '$remote'"
          printf 'Worker instalado: `%s`. Filas permanecem pausadas; validar piloto n8n.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/fabio_deploy" "$HOME/.ssh/known_hosts"
